# Configuración para permitir subida de archivos PDF de hasta 25MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
# Puerto en el que correrá el backend (opcional, por defecto es 8080)
server.port=8080
# ===== Logging: consola + archivo rotativo con id de correlación =====
logging.file.name=logs/analyzer-backend.log
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n
logging.level.com.bibliography.analyzer=INFO

